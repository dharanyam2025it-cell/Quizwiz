<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>QuizWiz - Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h1>QuizWiz Register</h1>

    <div class="tabs">
        <a th:href="@{/register(role='faculty')}"
           th:classappend="${role == 'faculty'} ? 'active'">Faculty</a>
        <a th:href="@{/register(role='student')}"
           th:classappend="${role == 'student'} ? 'active'">Student</a>
    </div>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form method="post" th:action="@{/register}">
        <input type="hidden" name="role" th:value="${role}">

        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required minlength="6">
        </div>

        <div class="form-group" th:if="${role == 'student'}">
            <label>Class Name</label>
            <input type="text" name="className" placeholder="e.g. IT-2A">
        </div>

        <button type="submit">Register</button>
    </form>

    <p style="margin-top:16px; font-size:14px;">
        Already have an account?
        <a th:href="@{/login(role=${role})}">Login here</a>
    </p>
</div>

</body>
</html>
