<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Questions</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('Manage Questions')}"></div>

<div class="page">

    <a class="btn" th:href="@{/faculty/dashboard}">&larr; Back to Dashboard</a>

    <div class="card">
        <h2 th:text="'Quiz: ' + ${quiz.title}"></h2>
        <p th:text="'Time limit: ' + ${quiz.timeLimit} + ' minutes'"></p>
    </div>

    <div class="card">
        <h2>Add Question</h2>

        <div class="error" th:if="${error}" th:text="${error}"></div>

        <form method="post" th:action="@{/faculty/quizzes/{id}/questions(id=${quiz.id})}">

            <div class="form-group">
                <label>Question Text</label>
                <textarea name="questionText" rows="2" required></textarea>
            </div>

            <div class="form-group">
                <label>Option A</label>
                <input type="text" name="optionA" required>
            </div>
            <div class="form-group">
                <label>Option B</label>
                <input type="text" name="optionB" required>
            </div>
            <div class="form-group">
                <label>Option C</label>
                <input type="text" name="optionC" required>
            </div>
            <div class="form-group">
                <label>Option D</label>
                <input type="text" name="optionD" required>
            </div>

            <div class="form-group">
                <label>Correct Option</label>
                <select name="correctOption" required>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>

            <div class="form-group">
                <label>Marks</label>
                <input type="number" name="marks" min="1" required>
            </div>

            <button type="submit">Add Question</button>
        </form>
    </div>

    <div class="card">
        <h2>Questions</h2>

        <table th:if="${!questions.isEmpty()}">
            <tr>
                <th>#</th>
                <th>Question</th>
                <th>Correct</th>
                <th>Marks</th>
                <th>Actions</th>
            </tr>
            <tr th:each="q, iter : ${questions}">
                <td th:text="${iter.count}"></td>
                <td th:text="${q.questionText}"></td>
                <td th:text="${q.correctOption}"></td>
                <td th:text="${q.marks}"></td>
                <td>
                    <form method="post"
                          th:action="@{/faculty/quizzes/{qid}/questions/{id}/delete(qid=${quiz.id}, id=${q.id})}"
                          style="display:inline;">
                        <button type="submit" class="btn btn-danger"
                                onclick="return confirm('Delete this question?');">Delete</button>
                    </form>
                </td>
            </tr>
        </table>

        <p th:if="${questions.isEmpty()}">No questions added yet.</p>
    </div>

</div>

</body>
</html>
