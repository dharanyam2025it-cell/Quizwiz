<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>QuizWiz - Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h1>QuizWiz Login</h1>

    <div class="tabs">
        <a th:href="@{/login(role='faculty')}"
           th:classappend="${role == 'faculty'} ? 'active'">Faculty</a>
        <a th:href="@{/login(role='student')}"
           th:classappend="${role == 'student'} ? 'active'">Student</a>
    </div>

    <div class="error" th:if="${error}" th:text="${error}"></div>
    <div class="success" th:if="${success}" th:text="${success}"></div>

    <form method="post" th:action="@{/login}">
        <input type="hidden" name="role" th:value="${role}">

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>

        <button type="submit">Login</button>
    </form>

    <p style="margin-top:16px; font-size:14px;">
        No account?
        <a th:href="@{/register(role=${role})}">Register here</a>
    </p>
</div>

</body>
</html>
